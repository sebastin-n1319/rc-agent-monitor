<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>T1 Ticket Flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F7F9;--card:#FFFFFF;--soft:#EEF2F6;--line:#E0E6ED;--line2:#C9D2DD;--t1:#072B40;--t2:#3E566A;--t3:#6B849A;
  --acc:#F4891F;--acc-ink:#A6520A;--acc-soft:rgba(244,137,31,.12);--ok:#0E7C52;--ok-soft:rgba(14,124,82,.10);--team:#1E5FA8;--team-soft:rgba(30,95,168,.09);
  --info:#6B849A;--info-soft:rgba(107,132,154,.10);--hero:#072B40;--hero-ink:#FFFFFF;--hero-sub:#B9CCDB;--shadow:0 1px 2px rgba(7,43,64,.06),0 6px 20px rgba(7,43,64,.06)}
@media (prefers-color-scheme:dark){:root{--bg:#061520;--card:#0B1F2E;--soft:#0E2536;--line:#1D3A52;--line2:#2A4D69;--t1:#E8F1F8;--t2:#B4C6D6;--t3:#8AA2B6;
  --acc:#F59A3C;--acc-ink:#F7A452;--acc-soft:rgba(245,154,60,.14);--ok:#42CF97;--ok-soft:rgba(66,207,151,.12);--team:#7DB3F0;--team-soft:rgba(125,179,240,.12);
  --info:#8AA2B6;--info-soft:rgba(138,162,182,.12);--hero:#0B2A3F;--hero-ink:#FFFFFF;--hero-sub:#9FB8CB;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25)}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{margin:0;background:var(--bg);color:var(--t1);font-family:'Poppins',system-ui,sans-serif;font-size:15px;line-height:1.5}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
/* hero */
.hero{background:var(--hero);color:var(--hero-ink);padding:44px 0 92px;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;right:-160px;top:-160px;width:400px;height:400px;border-radius:50%;border:56px solid rgba(244,137,31,.14);z-index:0;pointer-events:none}
.hero .wrap{position:relative;z-index:1}
@media (max-width:1400px){.hero::after{right:-240px;top:-220px}}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--acc)}
.hero h1{margin:8px 0 6px;font-size:clamp(28px,4.4vw,44px);font-weight:800;letter-spacing:-.02em;line-height:1.1;max-width:720px}
.hero p{margin:0;color:var(--hero-sub);font-size:17px;max-width:620px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:-56px;position:relative;z-index:1}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 18px 16px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:30px;font-weight:800;letter-spacing:-.02em;color:var(--t1)}
.stat span{color:var(--t3);font-size:13px}
.stat:first-child b{color:var(--acc-ink)}
/* stage rail */
.rail{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin-top:28px}
.rail ol{list-style:none;margin:0 auto;padding:10px 16px;max-width:1180px;display:flex;gap:6px;overflow-x:auto}
.rail button{display:flex;align-items:center;gap:8px;white-space:nowrap;border:1px solid transparent;background:none;border-radius:999px;padding:6px 12px 6px 6px;cursor:pointer;color:var(--t2);font-size:13px;font-weight:600}
.rail button i{font-style:normal;display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--soft);color:var(--t2);font-size:12px;font-weight:700}
.rail button[aria-current="true"]{border-color:var(--line);background:var(--card);color:var(--t1)}
.rail button[aria-current="true"] i{background:var(--acc);color:#fff}
.rail .sep{flex:0 0 18px;align-self:center;height:2px;background:var(--line2);border-radius:2px}
section{scroll-margin-top:64px}
main section.wrap{padding-top:64px;padding-bottom:8px}
#s-journey{padding-top:72px}
details.full section{padding-top:48px}
footer.wrap{padding-top:56px;padding-bottom:48px}
.sh{display:flex;align-items:baseline;gap:12px;margin-bottom:8px}
.sh .num{font-weight:800;color:var(--acc);font-size:15px}
.sh h2{margin:0;font-size:24px;font-weight:700;letter-spacing:-.01em}
.lede{margin:0 0 20px;color:var(--t3)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
/* try it */
.try{display:grid;grid-template-columns:300px 1fr;gap:16px}
.scen{padding:16px}
.scen h3,.walk h3{margin:0 0 10px;font-size:14px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.06em}
.scen button{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer;font-size:14px;font-weight:500;transition:border-color .15s,background .15s}
.scen button:hover{border-color:var(--acc)}
.scen button[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft);color:var(--acc-ink)}
.walk{padding:20px;min-height:340px;display:flex;flex-direction:column}
.trail{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;min-height:28px}
.crumb{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--soft);color:var(--t2);animation:pop .25s ease}
.crumb b{color:var(--t1)}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
.qbox{animation:rise .3s ease}
@keyframes rise{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.qno{font-size:12px;font-weight:700;color:var(--acc-ink);letter-spacing:.06em;text-transform:uppercase}
.qtext{font-size:24px;font-weight:700;margin:4px 0 4px;letter-spacing:-.01em}
.qhint{color:var(--t3);margin:0 0 18px;font-size:14px}
.yn{display:flex;gap:10px}
.yn button{min-width:112px;height:46px;border-radius:12px;border:1px solid var(--line2);background:var(--card);font-weight:700;font-size:15px;cursor:pointer;transition:transform .1s,border-color .15s}
.yn button:hover{border-color:var(--acc);transform:translateY(-1px)}
.yn button.yes{background:var(--t1);color:var(--card);border-color:var(--t1)}
.res{border-radius:14px;padding:18px;animation:rise .3s ease}
.res.t1{background:var(--ok-soft);border:1px solid color-mix(in srgb,var(--ok) 35%,transparent)}
.res.team{background:var(--team-soft);border:1px solid color-mix(in srgb,var(--team) 35%,transparent)}
.res.info{background:var(--info-soft);border:1px solid var(--line2)}
.res .tag{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.res.t1 .tag{color:var(--ok)}.res.team .tag{color:var(--team)}.res.info .tag{color:var(--info)}
.res h4{margin:4px 0 4px;font-size:22px}
.res p{margin:0 0 8px;color:var(--t2)}
.res ol{margin:8px 0 0;padding-left:20px;color:var(--t2)}
.res ol ol{list-style:lower-alpha;margin:4px 0}
.next{margin-top:auto;padding-top:16px;display:flex;gap:10px;flex-wrap:wrap}
.btn{height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--line2);background:var(--card);font-weight:600;font-size:13.5px;cursor:pointer}
.btn:hover{border-color:var(--acc);color:var(--acc-ink)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.mini{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:12px;font-size:12.5px;color:var(--t2)}
.mini span{padding:4px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line)}
/* flow */
.intake{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.ch{padding:14px}
.ch b{display:block;font-size:14px}
.ch .sh2{display:inline-block;margin:2px 0 6px;font-size:12px;font-weight:700;color:var(--acc-ink)}
.ch p{margin:0;font-size:13px;color:var(--t3)}
.down{display:flex;justify-content:center;padding:10px 0}
.down::before{content:'';width:2px;height:28px;background:var(--line2);border-radius:2px;position:relative}
.setup{display:grid;grid-template-columns:1.4fr 1fr;gap:12px}
.setup ul{margin:0;padding:16px 18px 16px 36px;color:var(--t2);font-size:14px;columns:2;column-gap:28px}
.setup li{margin-bottom:6px;break-inside:avoid}
.agent{padding:16px 18px;display:flex;align-items:center;gap:14px;font-size:14px;color:var(--t2)}
.agent .dot{flex:0 0 40px;height:40px;border-radius:12px;background:var(--acc-soft);display:grid;place-items:center;color:var(--acc-ink);font-weight:800}
.spine{position:relative}
.row{display:grid;grid-template-columns:minmax(0,1fr) 72px minmax(0,1.25fr);align-items:center;position:relative;transition:opacity .3s}
.row+.row{margin-top:30px}
.ncol{align-self:stretch;display:flex;flex-direction:column;align-items:center}
.ncol::before,.ncol::after{content:'';flex:1 1 0;min-height:8px;width:2px;background:var(--line2)}
.row:first-child .ncol::before{background:transparent}
.row:last-child .ncol::after{background:transparent}
.row:not(:last-child) .ncol::after{margin-bottom:-30px}
.dl{font-size:11px;font-weight:700;color:var(--t3);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin:6px 0 0}
.node{width:100%;position:relative;background:var(--card);border:1.5px solid var(--line2);border-radius:14px;padding:14px 16px 14px 56px;min-height:72px;display:flex;flex-direction:column;justify-content:center;transition:border-color .3s,box-shadow .3s}
.node i{position:absolute;left:14px;top:50%;transform:translateY(-50%) rotate(45deg);width:28px;height:28px;border-radius:6px;background:#F7D33C;display:grid;place-items:center}
.node i em{transform:rotate(-45deg);font-style:normal;font-weight:800;font-size:12px;color:#072B40}
.node b{font-size:15px}
.node small{color:var(--t3);font-size:12.5px}
.link{height:2px;background:var(--line2);position:relative}
.link span{position:absolute;left:50%;top:-20px;transform:translateX(-50%);font-size:11px;font-weight:700;color:var(--t3);background:var(--bg);padding:0 4px}
.link::after{content:'';position:absolute;right:-1px;top:-4px;border:5px solid transparent;border-left:7px solid var(--line2);border-right:0}
.out{border-radius:14px;padding:12px 16px;border:1px solid var(--line);background:var(--card);transition:box-shadow .3s,transform .3s}
.out.t1{border-color:color-mix(in srgb,var(--ok) 40%,transparent);background:linear-gradient(0deg,var(--ok-soft),var(--ok-soft)),var(--card)}
.out.team{border-color:color-mix(in srgb,var(--team) 35%,transparent);background:linear-gradient(0deg,var(--team-soft),var(--team-soft)),var(--card)}
.out .tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--t3)}
.out.t1 .tag{color:var(--ok)}.out.team .tag{color:var(--team)}
.out b{display:block;font-size:15px}
.out p{margin:2px 0 0;font-size:13px;color:var(--t2)}
.out ol{margin:6px 0 0;padding-left:18px;font-size:13px;color:var(--t2)}
.out ol ol{list-style:lower-alpha}
.spine.lit .row{opacity:.38}
.spine.lit .row.on{opacity:1}
.spine.lit .row.on .node{border-color:var(--acc);box-shadow:0 0 0 4px var(--acc-soft)}
.spine.lit .row.end .out{box-shadow:0 0 0 3px var(--acc),var(--shadow)}
.lane{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:12px;align-items:stretch}
.step{padding:16px;position:relative}
.step .k{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--acc-ink)}
.step b{display:block;margin:2px 0 6px}
.step ol,.step p{margin:0;font-size:13.5px;color:var(--t2)}
.step ol{padding-left:18px}
.fork{display:grid;gap:8px}
.fork div{padding:10px 12px;border-radius:10px;font-size:13.5px}
.fork .y{background:var(--team-soft);color:var(--t1)}
.fork .n{background:var(--acc-soft);color:var(--t1)}
.after{margin-top:12px;padding:12px 16px;font-size:13.5px;color:var(--t2)}
.rules{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.rule{padding:16px;border-top:4px solid var(--acc)}
.rule b{display:block;margin-bottom:4px;font-size:14.5px}
.rule span{font-size:13px;color:var(--t2)}
footer{padding:48px 16px 48px;color:var(--t3);font-size:12.5px}

/* Batch 428: journey */
.lede-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}.lede-row .lede{margin:0}
.journey{padding:24px 20px 20px}
.track{position:relative;display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.tline{position:absolute;left:10%;right:10%;top:33px;height:4px;border-radius:4px;background:var(--line);z-index:0}
.tfill{height:100%;width:0;border-radius:4px;background:var(--acc);transition:width .6s ease}
.stop{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;background:none;border:0;cursor:pointer;padding:0 4px 6px;color:var(--t2)}
.stop .ic{width:70px;height:70px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:2px solid var(--line2);transition:all .3s}
.stop svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.stop b{font-size:14px;color:var(--t1)}.stop small{font-size:12px;color:var(--t3);max-width:190px}
.stop.done .ic{border-color:var(--acc);color:var(--acc-ink);background:linear-gradient(var(--acc-soft),var(--acc-soft)),var(--card)}
.stop.on .ic{border-color:var(--acc);background:var(--acc);color:#fff;transform:scale(1.08);box-shadow:0 0 0 8px var(--acc-soft)}
.stop.on .ic{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 6px var(--acc-soft)}50%{box-shadow:0 0 0 12px rgba(244,137,31,.06)}}
.jpanel{margin-top:22px;border-top:1px solid var(--line);padding-top:20px}
.jbody{animation:rise .35s ease}.jbody h3{margin:0;font-size:20px}.jbody>.lede{margin:2px 0 16px}
.jnav{display:flex;justify-content:space-between;align-items:center;margin-top:18px}.jcount{font-size:12.5px;color:var(--t3);font-weight:600}
.btn[disabled]{opacity:.4;cursor:default}
.bars{display:grid;gap:12px}
.barrow{display:grid;grid-template-columns:220px 1fr;gap:4px 16px;align-items:center}
.barrow p{grid-column:2;margin:0;font-size:13px;color:var(--t3)}
.bl{display:flex;justify-content:space-between;gap:8px;font-size:14px}.bl span{color:var(--acc-ink);font-weight:700}
.bt{height:12px;border-radius:6px;background:var(--soft);overflow:hidden}
.bf{height:100%;border-radius:6px;background:var(--acc);animation:grow .8s ease}.bf.team{background:var(--team)}
.bf.auto{width:100%;background:repeating-linear-gradient(45deg,var(--line2) 0 6px,transparent 6px 12px)}
@keyframes grow{from{width:0}}
.ticks{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tick{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--soft);font-size:13.5px;animation:rise .4s ease both}
.tick .ok{flex:0 0 22px;height:22px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:800}
.agentline{display:flex;gap:12px;align-items:center;margin-top:12px;font-size:14px;color:var(--t2)}
.agentline .dot{flex:0 0 40px;height:40px;border-radius:12px;background:var(--acc-soft);display:grid;place-items:center;color:var(--acc-ink);font-weight:800}
.note{margin:0 0 12px;font-size:13.5px;color:var(--t3)}
.ladder{display:grid;gap:8px}
.litem{border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
.lrow{width:100%;display:grid;grid-template-columns:34px 1fr auto 18px;gap:12px;align-items:center;padding:10px 14px;background:none;border:0;text-align:left;cursor:pointer}
.lrow.last{cursor:default;grid-template-columns:34px 1fr auto}
.lrow:hover .lq b{color:var(--acc-ink)}
.lno{width:30px;height:30px;border-radius:8px;background:#F7D33C;color:#072B40;display:grid;place-items:center;font-weight:800;font-size:13px}
.lq b{display:block;font-size:14.5px}.lq small{color:var(--t3);font-size:12.5px}
.lgo{font-size:12.5px;padding:4px 10px;border-radius:999px;white-space:nowrap;color:var(--t2);background:var(--soft)}
.lgo.t1{background:var(--ok-soft);color:var(--ok)}.lgo.team{background:var(--team-soft);color:var(--team)}
.chev{color:var(--t3);transition:transform .2s}.lrow[aria-expanded="true"] .chev{transform:rotate(180deg)}
.ldet{padding:0 16px 14px 60px;font-size:13.5px;color:var(--t2);animation:rise .25s ease}.ldet p{margin:0}.ldet ol{margin:6px 0 0;padding-left:18px}.ldet ol ol{list-style:lower-alpha}
.outg{display:grid;grid-template-columns:260px 1fr;gap:28px;align-items:center}.outg h4{margin:0 0 12px;font-size:15px}
.ringbox{text-align:center}.ringbox p{font-size:13px;color:var(--t3);margin:10px 0 0}
.ring{--p:70;width:190px;height:190px;margin:0 auto;border-radius:50%;background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--team-soft) 0);display:grid;place-items:center;animation:spin .9s ease}
.ring>div{width:136px;height:136px;border-radius:50%;background:var(--card);display:grid;place-content:center}
.ring b{font-size:32px;font-weight:800;color:var(--ok)}.ring span{font-size:12px;color:var(--t3)}
@keyframes spin{from{transform:rotate(-90deg) scale(.9);opacity:.3}}
.hsteps{display:grid;grid-template-columns:1.3fr 28px 1fr 28px 1.1fr;gap:8px;align-items:stretch}
.hs{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--soft);font-size:13.5px}
.hs .k{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--acc);color:#fff;font-weight:800;font-size:12px;margin-bottom:6px}
.hs b{display:block;margin-bottom:4px}.hs ol{margin:0;padding-left:18px;color:var(--t2)}.hs p{margin:0;color:var(--t2)}
.harrow{display:grid;place-items:center;color:var(--acc);font-weight:800;font-size:20px}
.gloss{padding:16px}.gchips{display:flex;flex-wrap:wrap;gap:8px}
.gchip{border:1px solid var(--line2);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.gchip[aria-pressed="true"]{background:var(--t1);color:var(--card);border-color:var(--t1)}
.gdef{margin:12px 0 0;font-size:14px;color:var(--t2);min-height:22px}
details.full{margin-top:36px}
details.full>summary{list-style:none;cursor:pointer;display:flex;flex-direction:column;gap:2px;padding:18px 20px;border:1px dashed var(--line2);border-radius:14px;background:var(--card)}
details.full>summary::-webkit-details-marker{display:none}
details.full>summary b{font-size:17px}details.full>summary b::before{content:'▸ ';color:var(--acc)}details.full[open]>summary b::before{content:'▾ '}
details.full>summary span{font-size:13px;color:var(--t3)}
@media (max-width:900px){.track{grid-template-columns:repeat(5,minmax(64px,1fr));overflow-x:auto}.stop small,.stop b{display:none}.track{overflow:visible}.stop .ic{width:52px;height:52px}.tline{top:24px}
  .barrow{grid-template-columns:1fr}.barrow p{grid-column:1}.ticks{grid-template-columns:1fr}.outg{grid-template-columns:1fr}.hsteps{grid-template-columns:1fr}.harrow{transform:rotate(90deg)}
  .lrow{grid-template-columns:30px 1fr 18px}.lrow .lgo{grid-column:2;justify-self:start;white-space:normal}.lrow.last{grid-template-columns:30px 1fr}}

.chgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.chc{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--soft);animation:rise .4s ease both}
.chc b{display:block;font-size:14px}.chc .auto{display:inline-block;margin:4px 0 2px;font-size:11px;font-weight:700;color:var(--acc-ink);background:var(--acc-soft);padding:2px 8px;border-radius:999px}.chc p{margin:4px 0 0;font-size:13px;color:var(--t3)}
.outg2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.oc{border-radius:14px;padding:18px;animation:rise .4s ease both}.oc b{display:block;font-size:19px;margin:2px 0 4px}.oc p{margin:0;color:var(--t2);font-size:14px}
.oc .tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.oc.t1{background:var(--ok-soft);border:1px solid color-mix(in srgb,var(--ok) 35%,transparent)}.oc.t1 .tag{color:var(--ok)}
.oc.team{background:var(--team-soft);border:1px solid color-mix(in srgb,var(--team) 35%,transparent);animation-delay:.15s}.oc.team .tag{color:var(--team)}
.dchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.dchips span{font-size:13px;font-weight:600;padding:5px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line)}
@media (max-width:900px){.chgrid{grid-template-columns:1fr 1fr}.outg2{grid-template-columns:1fr}}
/* sign in */
.center{max-width:440px;margin:14vh auto 0;padding:28px;border:1px solid var(--line);border-radius:16px;background:var(--card);text-align:center}
.center h2{margin:0 0 6px;font-size:18px}.center p{margin:0 0 18px;color:var(--t3);font-size:13px}
#gbtn{display:flex;justify-content:center;min-height:44px}
.err{color:#B4323A}
@media (max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}.try{grid-template-columns:1fr}.intake{grid-template-columns:repeat(2,1fr)}.setup{grid-template-columns:1fr}.setup ul{columns:1}
  .row,.final{grid-template-columns:1fr}.link{height:24px;width:2px;margin:0 auto}.link span{top:2px;left:10px;transform:none}.link::after{display:none}
  .ncol::before,.ncol::after,.dl{display:none}.lane{grid-template-columns:1fr}.rules{grid-template-columns:1fr 1fr}}
@media print{.try,.journey .jnav,#s-journey .btn{display:none}.hero{padding-bottom:70px}}

    var btns = document.querySelectorAll('.rail button');
    var io = new IntersectionObserver(function (es) {
      es.forEach(function (e) { if (!e.isIntersecting) return; var id = e.target.getAttribute('data-s'); if (id === 'checks') id = e.boundingClientRect.top < 0 ? 'outcome' : 'checks';
        Array.prototype.forEach.call(btns, function (b) { b.setAttribute('aria-current', String(b.getAttribute('data-s') === id)); }); });
    }, { rootMargin: '-40% 0px -55% 0px' });
    Array.prototype.forEach.call(document.querySelectorAll('section[data-s]'), function (s) { io.observe(s); });
    var outBtn = document.querySelector('.rail button[data-s="outcome"]');
    if (outBtn) outBtn.onclick = function () { document.getElementById('s-checks').scrollIntoView(); };
  }
  load();
})();
</script>
</body>
</html>
