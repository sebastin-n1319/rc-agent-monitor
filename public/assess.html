<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Adit Assessments</title>
<link rel="icon" href="/adit-icon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assess.css?v=2.16.0">
<link rel="stylesheet" href="/illus.css?v=1.0.0">
<script src="/illus.js?v=1.0.0"></script>
<script>
try{
  var q=new URLSearchParams(location.search);
  if(q.get('embed')==='1') document.documentElement.classList.add('embed');
  var d=localStorage.getItem('aditDarkMode'); if(d==='1') document.documentElement.setAttribute('data-theme','dark'); else if(d==='0') document.documentElement.setAttribute('data-theme','light');
}catch(e){}
</script>
</head>
<body>
<div class="as-app" id="as-app">
  <div class="as-top" role="banner">
    <a class="as-brand" href="/assess"><img src="/adit-icon-32.png" alt="" width="26" height="26"><span>Adit Assessments</span></a>
    <nav class="as-nav" id="as-nav" aria-label="Sections"></nav>
    <div class="as-user" id="as-user"></div>
  </div>
  <main class="as-main" id="as-main" tabindex="-1">
    <div class="skel" style="height:22px;width:220px;margin-bottom:10px"></div>
    <div class="skel" style="height:14px;width:360px;margin-bottom:26px"></div>
    <div class="skel" style="height:180px;max-width:380px"></div>
  </main>
</div>
<canvas class="wm" id="as-wm" aria-hidden="true"></canvas>
<div class="sr-only" id="as-live" aria-live="polite"></div>
<script src="/assess.js?v=2.16.0" defer></script>
</body>
</html>
